<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Validasi Core Idle - STO & GM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        table { border-collapse: collapse; width: 100%; font-size: 11px; }
        th, td { border: 1px solid #d1d5db; padding: 6px 8px; text-align: center; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6">
        <!-- Header & Switcher Report STO / GM -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
            <div>
                <h1 id="dashboard-title" class="text-xl font-bold text-gray-800">📊 Report Validasi Core Idle (STO)</h1>
                <p class="text-xs text-gray-500 mt-1">Sinkronisasi otomatis dari Google Spreadsheet</p>
            </div>
            
            <!-- Tombol Pilihan Report -->
            <div class="flex items-center space-x-2 bg-gray-100 p-1 rounded-lg">
                <button id="btn-sto" onclick="switchReport('STO')" class="px-4 py-2 text-xs font-semibold rounded-md transition bg-emerald-700 text-white shadow">Report STO</button>
                <button id="btn-gm" onclick="switchReport('GM')" class="px-4 py-2 text-xs font-semibold rounded-md transition text-gray-600 hover:bg-gray-200">Report GM</button>
            </div>

            <div class="flex items-center space-x-3">
                <span id="status-badge" class="text-xs bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full font-medium">Memuat...</span>
                <button onclick="fetchData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded font-medium shadow transition">
                    🔄 Refresh Data
                </button>
            </div>
        </div>

        <!-- Tabel Utama -->
        <div class="overflow-x-auto">
            <table id="mainTable" class="w-full bg-white">
                <thead>
                    <tr class="bg-emerald-800 text-white font-bold text-center">
                        <th rowspan="2" class="border-emerald-700 w-12">NO</th>
                        <th id="col-header-name" rowspan="2" class="border-emerald-700 w-28">STO</th>
                        <th colspan="3" class="bg-emerald-700 border-emerald-600">CORE FEEDER (TGT YTD 66.67%)</th>
                        <th colspan="3" class="bg-emerald-800 border-emerald-700">CORE DISTRIBUSI (TGT YTD 66.67%)</th>
                    </tr>
                    <tr class="bg-emerald-700 text-white font-semibold text-center text-[10px]">
                        <th>TGT SEPTEMBER</th>
                        <th>VALID</th>
                        <th>% VALID YTD</th>
                        <th>TGT SEPTEMBER</th>
                        <th>VALID</th>
                        <th>% VALID YTD</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="8" class="p-6 text-gray-400 text-center">Mengambil data dari spreadsheet...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyg-Z_WbSLow4myEkKpHrio_kw1Yj-4C2aS4uzkn8Xyia1qD5CJxR1500ahcSCEFh1tnA/exec";
        
        let currentReport = 'STO';

        function switchReport(type) {
            currentReport = type;
            const titleEl = document.getElementById("dashboard-title");
            const colHeaderEl = document.getElementById("col-header-name");
            const btnSto = document.getElementById("btn-sto");
            const btnGm = document.getElementById("btn-gm");

            if (type === 'STO') {
                titleEl.innerText = "📊 Report Validasi Core Idle (STO)";
                colHeaderEl.innerText = "STO";
                btnSto.className = "px-4 py-2 text-xs font-semibold rounded-md transition bg-emerald-700 text-white shadow";
                btnGm.className = "px-4 py-2 text-xs font-semibold rounded-md transition text-gray-600 hover:bg-gray-200";
            } else {
                titleEl.innerText = "📊 Report Validasi Core Idle (GM)";
                colHeaderEl.innerText = "GM";
                btnSto.className = "px-4 py-2 text-xs font-semibold rounded-md transition text-gray-600 hover:bg-gray-200";
                btnGm.className = "px-4 py-2 text-xs font-semibold rounded-md transition bg-emerald-700 text-white shadow";
            }

            fetchData();
        }

        async function fetchData() {
            const badge = document.getElementById("status-badge");
            badge.innerText = "Memuat...";

            const targetUrl = `${WEB_APP_URL}?type=${currentReport}`;

            try {
                const response = await fetch(targetUrl);
                const rawData = await response.json();

                let tbody = document.getElementById("table-body");
                tbody.innerHTML = "";

                if (!rawData || rawData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-gray-400 text-center">Data kosong</td></tr>`;
                    badge.innerText = "Kosong";
                    return;
                }

                let validRows = 0;
                let totFdrTgt = 0, totFdrVal = 0, totDstTgt = 0, totDstVal = 0;

                rawData.forEach((row) => {
                    let values = Object.values(row);

                    // Ambil nilai dari kolom STO (indeks 1 atau 2 tergantung struktur asli sheet)
                    let sto = values[1] || "";
                    let stoStr = String(sto).trim();
                    
                    // Lewati baris kosong atau baris teks catatan/judul
                    if (!stoStr || stoStr === "-" || stoStr.toLowerCase().includes("warna") || stoStr.toLowerCase().includes("batas") || stoStr.toLowerCase().includes("copas")) return;
                    // Lewati juga jika baris tersebut adalah header judul tabel
                    if (stoStr.toLowerCase().includes("sto") || stoStr.toLowerCase().includes("gm") || stoStr.toLowerCase().includes("tgt") || stoStr.toLowerCase().includes("valid")) return;

                    validRows++;
                    let num = (val) => parseFloat(String(val || 0).replace(/,/g, '')) || 0;

                    let no = validRows;
                    let stoVal = sto;

                    let fdrTgt = num(values[2]);     
                    let fdrVal = num(values[3]);     
                    let fdrPct = num(values[4]);     

                    let dstTgt = num(values[5]);     
                    let dstVal = num(values[6]);     
                    let dstPct = num(values[7]);     

                    totFdrTgt += fdrTgt; 
                    totFdrVal += fdrVal;
                    totDstTgt += dstTgt; 
                    totDstVal += dstVal;

                    let fdrColor = fdrPct < 66.67 ? "bg-red-200 text-red-900 font-bold" : "bg-emerald-600 text-white font-bold";
                    let dstColor = dstPct < 66.67 ? "bg-red-200 text-red-900 font-bold" : "bg-emerald-600 text-white font-bold";

                    let tr = document.createElement("tr");
                    tr.className = "hover:bg-gray-50";
                    tr.innerHTML = `
                        <td>${no}</td>
                        <td class="font-bold text-blue-700 text-left pl-4">${stoVal}</td>
                        <td class="text-right">${fdrTgt ? fdrTgt.toLocaleString() : "-"}</td>
                        <td class="text-right">${fdrVal ? fdrVal.toLocaleString() : "-"}</td>
                        <td class="${fdrColor}">${fdrPct ? fdrPct + '%' : '-'}</td>
                        <td class="text-right">${dstTgt ? dstTgt.toLocaleString() : "-"}</td>
                        <td class="text-right">${dstVal ? dstVal.toLocaleString() : "-"}</td>
                        <td class="${dstColor}">${dstPct ? dstPct + '%' : '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });

                let avgFdrPct = totFdrTgt > 0 ? ((totFdrVal / totFdrTgt) * 100).toFixed(1) : 0;
                let avgDstPct = totDstTgt > 0 ? ((totDstVal / totDstTgt) * 100).toFixed(1) : 0;

                let totalTr = document.createElement("tr");
                totalTr.className = "bg-emerald-800 text-white font-bold text-center";
                totalTr.innerHTML = `
                    <td colspan="2">TOTAL</td>
                    <td class="text-right">${totFdrTgt.toLocaleString()}</td>
                    <td class="text-right">${totFdrVal.toLocaleString()}</td>
                    <td>${avgFdrPct}%</td>
                    <td class="text-right">${totDstTgt.toLocaleString()}</td>
                    <td class="text-right">${totDstVal.toLocaleString()}</td>
                    <td>${avgDstPct}%</td>
                `;
                tbody.appendChild(totalTr);

                badge.className = "text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium";
                badge.innerText = "Terhubung (" + currentReport + ")";

            } catch (error) {
                console.error(error);
                badge.className = "text-xs bg-red-100 text-red-800 px-3 py-1 rounded-full font-medium";
                badge.innerText = "Gagal memuat!";
            }
        }

        fetchData();
    </script>
</body>
</html>
